name: Release

on:
  push:
    tags: ["v*"]
  # Releases the version in extension/manifest.json from the chosen branch,
  # creating its v* tag.
  workflow_dispatch:
    inputs:
      stores_only:
        description: Skip the GitHub release and only submit to the browser stores
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Check release version
        run: node scripts/check-version.js
      - run: npm ci
      - run: npm run submission
      - name: Publish release
        if: ${{ !inputs.stores_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v$(node -p 'require("./extension/manifest.json").version')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then target=--verify-tag; else target="--target=$GITHUB_SHA"; fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt \
            submission/*reviewer-source*.zip \
            --title "Birdify ${RELEASE_TAG#v}" \
            --notes-file docs/RELEASE_NOTES.md "$target"
      # Submits to Mozilla once the AMO_JWT_ISSUER and AMO_JWT_SECRET repository secrets exist.
      - name: Check for AMO credentials
        id: amo
        run: echo "configured=${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}" >> "$GITHUB_OUTPUT"
      - name: Submit to addons.mozilla.org
        if: steps.amo.outputs.configured == 'true'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npm run publish:amo
      # Submits to the Chrome Web Store once its five CWS_* repository secrets exist.
      - name: Check for Chrome Web Store credentials
        id: cws
        run: echo "configured=${{ secrets.CWS_CLIENT_ID != '' && secrets.CWS_CLIENT_SECRET != '' && secrets.CWS_REFRESH_TOKEN != '' && secrets.CWS_PUBLISHER_ID != '' && secrets.CWS_ITEM_ID != '' }}" >> "$GITHUB_OUTPUT"
      - name: Submit to the Chrome Web Store
        if: steps.cws.outputs.configured == 'true'
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ secrets.CWS_ITEM_ID }}
        run: npm run publish:chrome
